<!--index.html-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CapyType</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/features.css" />
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body tabindex="0"> <!-- make body focusable -->
  <div class="container">
    <div id="ad-left">ads</div>
    <div class="settings-panel">
      <!-- Language Setting -->
      <div id="languageSettings" class="settings">
        <span>Language:</span>
        <select id="languageSelector">
          <!-- Populated by JS -->
        </select>
      </div>
      <!-- Mode Setting -->
      <div id="modeSettings" class="settings">
        <span>Mode:</span>
        <label><input type="radio" name="mode" value="random" checked> Random</label>
        <label><input type="radio" name="mode" value="paragraphs"> Real Paragraphs</label>
      </div>
      <!-- Word List Size Setting -->
      <div id="wordListSizeSettings" class="settings hidden">
        <span>Word List Size:</span>
        <!-- Radios populated by JS -->
      </div>
      <!-- Toggles Setting -->
      <div id="togglesSettings" class="settings hidden">
        <label><input type="checkbox" id="punctuationToggle"> Punctuation</label>
        <label><input type="checkbox" id="numbersToggle"> Numbers</label>
        <label><input type="checkbox" id="advancedSymbolsToggle"> Advanced Symbols</label>
      </div>
      <!-- Hide‑Words Setting -->
      <div id="hideWordsSettings" class="settings">
        <span>Hide Words:</span>
        <label><input type="radio" name="hideWords" value="off" checked> Off</label>
        <label><input type="radio" name="hideWords" value="current"> Hide Current Word</label>
        <label><input type="radio" name="hideWords" value="currentNext"> Hide Current &amp; Next Word</label>
      </div>
      <!-- Highlight-Ahead Setting -->
      <div id="highlightAheadSettings" class="settings">
        <span>Highlight Ahead:</span>
        <label><input type="radio" name="highlightAhead" value="off" checked> Off</label>
        <label><input type="radio" name="highlightAhead" value="next"> Next Word</label>
        <label><input type="radio" name="highlightAhead" value="next2"> 2nd Word</label>
      </div>
      <!-- Keyboard Diagram Setting -->
      <div id="keyboardDiagramSettings" class="settings">
        <span>Show Keyboard Guide:</span>
        <label><input type="radio" name="keyboardDiagram" value="off" checked> Off</label>
        <label><input type="radio" name="keyboardDiagram" value="on"> On</label>
      </div>
      <!-- Timer Setting -->
      <div id="timerSettings" class="settings">
        <span>Timer:</span>
        <label><input type="radio" name="timer" value="off"> Off</label>
        <label><input type="radio" name="timer" value="15" checked> 15s</label>
        <label><input type="radio" name="timer" value="30"> 30s</label>
        <label><input type="radio" name="timer" value="60"> 1 min</label>
        <label><input type="radio" name="timer" value="120"> 2 min</label>
        <label><input type="radio" name="timer" value="300"> 5 min</label>
      </div>
      <!-- Word Limit Setting -->
      <div id="wordLimitSettings" class="settings">
        <span>Word Limit:</span>
        <label><input type="radio" name="wordLimit" value="off" checked> Off</label>
        <label><input type="radio" name="wordLimit" value="5"> 5</label>
        <label><input type="radio" name="wordLimit" value="10"> 10</label>
        <label><input type="radio" name="wordLimit" value="15"> 15</label>
        <label><input type="radio" name="wordLimit" value="20"> 20</label>
        <label><input type="radio" name="wordLimit" value="25"> 25</label>
        <label><input type="radio" name="wordLimit" value="30"> 30</label>
        <label><input type="radio" name="wordLimit" value="50"> 50</label>
        <label><input type="radio" name="wordLimit" value="100"> 100</label>
        <label><input type="radio" name="wordLimit" value="200"> 200</label>
      </div>
      <!-- Ghost Cursor Setting -->
      <div id="ghostCursorSettings" class="settings">
        <span>Ghost Cursor:</span>
        <label><input type="radio" name="ghostMode" value="off" checked> Off</label>
        <label><input type="radio" name="ghostMode" value="last"> Last Speed</label>
        <label><input type="radio" name="ghostMode" value="highest"> Highest Speed</label>
        <label><input type="radio" name="ghostMode" value="custom"> Custom</label>
        <input type="number" id="customGhostWPM" value="60" min="10" max="300" style="width: 4em; margin-left: 0.5rem;">
      </div>
      <!-- Show Typed Errors Setting -->
      <div id="showTypedErrorsSettings" class="settings">
        <span>Show Typed Errors:</span>
        <label><input type="radio" name="showTypedErrors" value="off" checked> Off</label>
        <label><input type="radio" name="showTypedErrors" value="on"> On</label>
      </div>
      <!-- Min WPM Setting -->
      <div id="minWPMSettings" class="settings">
        <span>End if WPM <</span>
        <label><input type="radio" name="minWPM" value="off" checked> Off</label>
        <label><input type="radio" name="minWPM" value="on"> On</label>
        <input type="number" id="minWPMThreshold" value="50" min="10" max="300" style="width: 4em; margin-left: 0.5rem;">
      </div>
      <!-- Min Accuracy Setting -->
      <div id="minAccuracySettings" class="settings">
        <span>End if Accuracy <</span>
        <label><input type="radio" name="minAccuracy" value="off" checked> Off</label>
        <label><input type="radio" name="minAccuracy" value="on"> On</label>
        <input type="number" id="minAccuracyThreshold" value="95" min="50" max="100" style="width: 4em; margin-left: 0.5rem;"> %
      </div>
      <!-- Strict Mode Setting -->
      <div id="strictModeSettings" class="settings">
        <span>End on Any Mistake:</span>
        <label><input type="radio" name="strictMode" value="off" checked> Off</label>
        <label><input type="radio" name="strictMode" value="on"> On</label>
      </div>
      <!-- Theme / customizer -->
      <div class="customizer">
        <label for="themeSelector">Theme:</label>
        <select id="themeSelector">
          <option value="capyparadise" selected>Capy Paradise</option>
          <option value="cyberpunk"> Cyberpunk</option>
        </select>
      </div>
      <div id="soundSettings" class="settings">
        <span>Type Sound:</span>
        <label><input type="radio" name="soundMode" value="off" checked> Off</label>
        <label><input type="radio" name="soundMode" value="pentatonic"> Pentatonic</label>
        <label><input type="radio" name="soundMode" value="blip"> Blip</label>
        <label><input type="radio" name="soundMode" value="click"> Click</label>
      </div>
    </div>
    <div class="typing-panel">
      <!-- Timer Display -->
      <div id="timerDisplay" class="timer-display hidden">
        <span id="timeRemaining"></span>
      </div>
      <div id="stats">
        <span id="wpm">WPM: 0</span>
        <span id="accuracy">Accuracy: 100%</span>
      </div>
      <!-- text + error side by side -->
      <div class="text-error-wrapper">
        <div id="textDisplay"></div>
        <div id="typedErrorDisplay" class="typed-error-display hidden">
          <div class="typed-error-label">You typed:</div>
          <div id="typedLetter" class="typed-error-letter"></div>
        </div>
      </div>
      <!-- Results Screen -->
      <div id="resultsScreen" class="results-screen hidden">
        <h2>Time's Up!</h2>
        <div class="results-stats">
          <div class="result-item">
            <span class="result-label">Final WPM:</span>
            <span id="finalWPM" class="result-value">0</span>
          </div>
          <div class="result-item">
            <span class="result-label">Accuracy:</span>
            <span id="finalAccuracy" class="result-value">100%</span>
          </div>
        </div>
        <button id="restartButton" class="restart-button">Start New Session</button>
      </div>
      <!-- Keyboard Diagram -->
      <div id="keyboardDiagram" class="keyboard-diagram hidden">
        <img id="keyboardImage" src="keyboard_and_hand/default.png" alt="Keyboard and hand guide">
      </div>
    </div>
  </div>
  <!-- your module entrypoint -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
