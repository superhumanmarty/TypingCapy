<!--index.html-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Keybara</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-M8NL0LT13W"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-M8NL0LT13W');
  </script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7874927413924922" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/features.css" />
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/edge-soft.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <!-- NEW: focus-mode styles -->
  <link rel="stylesheet" href="css/focus-mode.css" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/capy.png?v=1">
  <link rel="apple-touch-icon" href="/capy.png?v=1">
</head>
<body tabindex="0"> <!-- make body focusable -->
  <div class="container">
    <aside id="ad-left">
      <div class="ad-slot">ads</div>
    </aside>
    <div class="settings-panel">
      <div class="settings-group no-card">
        <div id="textGenHero" class="settings-hero">
          <img src="settings_images/lang.png" alt="" class="hero-icon" loading="lazy">

          <div class="hero-content">
            <div class="hero-title">TEXT</div>

            <div id="languageSettings">
              <div class="select-pill">
                <select id="languageSelector" class="ui-select"></select>
              </div>
            </div>


            <div id="wordListSizeSettings" class="hidden">
              <div class="select-pill">
                <select id="wordListSizeSelector" class="ui-select"></select>
              </div>
            </div>
            <!-- hidden state checkboxes that the split-pill buttons control -->
            <input type="checkbox" id="numbersToggle" hidden>
            <input type="checkbox" id="numbersExprToggle" hidden>
            <input type="checkbox" id="punctuationToggle" hidden>
            <input type="checkbox" id="symbolsToggle" hidden>
            <div id="togglesSettings">
              <div id="numbersSplit" class="split-pill" aria-label="Numbers toggles">
                <button id="numMain"  class="split-half left"  type="button" tabindex="-1">123</button>
                <button id="numExtra" class="split-half right" type="button" tabindex="-1" aria-disabled="true">+=</button>
              </div>
              <div id="punctSplit" class="split-pill" aria-label="Punctuation toggles">
                <button id="punctMain"  class="split-half left"  type="button" tabindex="-1">!?</button>
                <button id="punctExtra" class="split-half right" type="button" tabindex="-1" aria-disabled="true">@#&</button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- GAME LIMITS hero — 3 buttons: Endless | Timer | Words -->
      <div class="settings-group no-card">
        <div id="limitsHero" class="settings-hero">
          <div class="hero-content">
            <div class="hero-title">GAME LIMITS</div>

            <!-- 3-button grid -->
            <div id="limitsButtons" class="limits-grid">
              <!-- ENDLESS -->
              <div class="limit-cell">
                <button id="btnEndless" class="limit-btn active" type="button" aria-pressed="true">
                  <div class="btn-label">Endless</div>
                </button>
              </div>

              <!-- TIMER -->
              <div class="limit-cell">
                <button id="btnTimer" class="limit-btn" type="button" aria-pressed="false">
                  <div class="btn-label">Timer</div>
                </button>
                <!-- moved OUTSIDE the button -->
                <div id="timerInline" class="btn-dropdown hidden">
                  <label for="timerInlineSelect" class="sr-only">Timer length</label>
                  <div class="select-pill small">
                    <select id="timerInlineSelect" class="ui-select" aria-label="Timer length">
                      <option value="15">15s</option>
                      <option value="30">30s</option>
                      <option value="60">1 min</option>
                      <option value="120">2 min</option>
                      <option value="300">5 min</option>
                    </select>
                  </div>
                </div>
              </div>

              <!-- WORD LIMIT -->
              <div class="limit-cell">
                <button id="btnWord" class="limit-btn" type="button" aria-pressed="false">
                  <div class="btn-label">Word #</div>
                </button>
                <!-- moved OUTSIDE the button -->
                <div id="wordInline" class="btn-dropdown hidden">
                  <label for="wordLimitInlineSelect" class="sr-only">Word limit</label>
                  <div class="select-pill small">
                    <select id="wordLimitInlineSelect" class="ui-select" aria-label="Word limit">
                      <option value="5">5</option>
                      <option value="10">10</option>
                      <option value="15">15</option>
                      <option value="20">20</option>
                      <option value="25">25</option>
                      <option value="30">30</option>
                      <option value="50">50</option>
                      <option value="100">100</option>
                      <option value="200">200</option>
                    </select>
                  </div>
                </div>

              </div>
            </div>


            <!-- Hidden mirrors for logic (keep IDs so existing code keeps working) -->
            <div class="hidden">
              <div id="timerSettings" class="settings inline-setting">
                <label for="timerSelector">⏱️</label>
                <select id="timerSelector">
                  <option value="off" selected>Off</option>
                  <option value="15">15s</option>
                  <option value="30">30s</option>
                  <option value="60">1 min</option>
                  <option value="120">2 min</option>
                  <option value="300">5 min</option>
                </select>
              </div>

              <div id="wordLimitSettings" class="settings inline-setting">
                <label for="wordLimitSelector">#️⃣</label>
                <select id="wordLimitSelector">
                  <option value="off" selected>Off</option>
                  <option value="5">5</option>
                  <option value="10">10</option>
                  <option value="15">15</option>
                  <option value="20">20</option>
                  <option value="25">25</option>
                  <option value="30">30</option>
                  <option value="50">50</option>
                  <option value="100">100</option>
                  <option value="200">200</option>
                </select>
              </div>
            </div>
            <!-- /Hidden mirrors -->
          </div>
        </div>
      </div>
      <!-- THEME pill -->
      <div class="settings-group no-card">
        <div id="themeHero" class="settings-hero">
          <img src="settings_images/theme.png" alt="Theme" class="hero-icon" loading="lazy">

          <div class="hero-content">
            <div class="hero-title">THEME</div>

            <div id="themeSettings">
              <div class="select-pill">
                <select id="themeSelector" class="ui-select">
                  <option value="capyparadise" selected>Capy Paradise</option>
                  <option value="cyberpunk">Cyberpunk</option>
                  <option value="christian">Christian</option>
                  <option value="roman-1">Roman 1</option>
                  <option value="roman-2">Roman 2</option>
                  <option value="murica">Murica</option>
                  <option value="vaporwave">Vaporwave</option>
                  <option value="brazil">Brazil</option>
                  <option value="hd-capy">HD Capy</option>
                  <option value="boba-capy">Boba Capy</option>
                  <option value="creepy">Creepy</option>
                  <option value="forest">Forest</option>
                  <option value="coral-reef">Coral Reef</option>
                  <option value="mountains">Mountains</option>
                  <option value="italy-coast">Italy Coast</option>
                  <option value="wet-capy">Wet Capy</option>
                  <option value="japan">Japan</option>
                  <option value="anime">Anime</option>
                  <option value="russian-capy">Russian Capy</option>
                  <option value="toast-capy">Toast Capy</option>
                  <option value="creepy-capy">Creepy Capy</option>
                  <option value="wood">Wood</option>
                  <option value="middle-east">Middle East</option>
                  <option value="lost">Lost</option>
                  <option value="castle">Castle</option>
                  <option value="city-night">City Night</option>
                  <option value="earth-from-space">Earth from Space</option>
                  <option value="cafe-capy">Cafe Capy</option>
                  <option value="cottage">Cottage</option>
                  <option value="dark-academia">Dark Academia</option>
                  <option value="space">Space</option>
                  <option value="coffee">Coffee</option>
                  <option value="city">City</option>
                  <option value="brutalist">Brutalist</option>
                  <option value="minimalist">Minimalist</option>
                  <option value="cream">Cream</option>
                  <option value="neutral">Neutral</option>

                </select>
              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- SOUND pill -->
      <div class="settings-group no-card">
        <div id="soundHero" class="settings-hero">
          <img src="settings_images/sound.png" alt="Sound" class="hero-icon" loading="lazy">

          <div class="hero-content">
            <div class="hero-title">SOUND</div>
            <!-- NEW: Music dropdown + volume -->
            <div id="musicSettings" class="plain">
              <label for="musicSelector" class="mini-label">Music</label>
              <div class="select-pill">
                <select id="musicSelector" class="ui-select" aria-label="Music">
                  <option value="off" selected>Off</option>
                  <option value="holiday">Holiday</option>
                  <option value="forest_sounds">Forest Sounds</option>
                  <option value="eastern">Eastern</option>
                  <option value="african">African</option>
                  <option value="middle_eastern">Middle Eastern</option>
                  <option value="classical">Classical</option>
                  <option value="ocean_waves">Ocean Waves</option>
                  <option value="piano">Piano</option>
                  <option value="lofi">Lofi</option>
                  <option value="guitar">Guitar</option>
                  <option value="synthwave">Synthwave</option>
                  <option value="spooky">Spooky</option>
                  <option value="jazz">Jazz</option>
                  <option value="zen">Zen</option>
                  <option value="fantasy">Fantasy</option>
                  <option value="ukelele">Ukelele</option>
                </select>
              </div>

              <!-- volume slider sits UNDER the music dropdown -->
              <div class="settings inline-setting" id="musicVolumeRow">
                <label for="musicVolume">Volume</label>
                <input type="range" id="musicVolume" min="0" max="100" value="50" step="1" tabindex="-1"/>
              </div>
            </div>

            <div id="soundSettings" class="plain">
              <label for="soundSelector" class="mini-label">Typing</label>
              <div class="select-pill">
                <select id="soundSelector" class="ui-select">
                  <option value="off" selected>Off</option>
                  <option value="pentatonic">Pentatonic</option>
                  <option value="blip">Blip</option>
                  <option value="click">Click</option>
                </select>
              </div>

              <!-- NEW: volume slider sits UNDER the typing (sound) dropdown -->
              <div class="settings inline-setting" id="soundVolumeRow">
                <label for="soundVolume">Volume</label>
                <input type="range" id="soundVolume" min="0" max="100" value="50" step="1" tabindex="-1"/>
              </div>
            </div>

          </div>
        </div>
      </div>
      <div class="settings-group no-card">
        <!-- NOOB hero -->
        <div class="settings-group no-card">
          <div id="noobHero" class="settings-hero">
            <img src="settings_images/noob.png" alt="Noob" class="hero-icon" loading="lazy">

            <div class="hero-content">
              <div class="hero-title">NOOB</div>

              <!-- keyboard diagram -->
              <div id="keyboardDiagramSettings" class="settings pill pill-single keyboard-pill" role="button" tabindex="-1">
                <input type="checkbox" id="keyboardDiagramToggle" class="pill-toggle" hidden>
                <img src="keyboard_and_hand/default.png" alt="Keyboard guide" class="keyboard-pill-img">
              </div>

              <!-- “You typed: x” pill -->
              <div id="typedErrorsPill" class="settings pill pill-preview" role="button" aria-pressed="false" tabindex="-1">
                <input type="checkbox" id="showTypedErrorsToggle" hidden>
                <div class="typed-preview" aria-hidden="true">
                  <div class="te-label">You typed:</div>
                  <div class="te-box">x</div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- PRO hero -->
        <div class="settings-group no-card">
          <div id="proHero" class="settings-hero">
            <img src="settings_images/pro.png" alt="Pro" class="hero-icon" loading="lazy">

            <div class="hero-content">
              <div class="hero-title">PRO</div>

              <!-- Hide -->
              <div id="hidePillRow" class="pill-row">
                <div id="hidePill" class="settings pill pill-wide transparent-text" role="button" tabindex="-1">
                  <div class="pill-title"><span class="muted">Hide</span></div>
                  <div id="hideChoiceLabel"></div>
                </div>
                <div id="hideOptions" class="pill-options replace hidden">
                  <button class="pill option" id="hideOff" type="button" tabindex="-1">Off</button>
                  <button class="pill option" id="hideCurrent" type="button" tabindex="-1">Current</button>
                  <button class="pill option" id="hideCurrentNext" type="button" tabindex="-1">Current &amp; Next</button>
                </div>
              </div>

              <!-- Highlight -->
              <div id="highlightPillRow" class="pill-row">
                <div id="highlightPill" class="settings pill pill-wide neon-green-text" role="button" tabindex="-1">
                  <div class="pill-title"><span class="neon">Highlight</span></div>
                  <div id="highlightChoiceLabel"></div>
                </div>
                <div id="highlightOptions" class="pill-options replace hidden">
                  <button class="pill option" id="hlOff" type="button" tabindex="-1">Off</button>
                  <button class="pill option" id="hlNext" type="button" tabindex="-1">Next</button>
                  <button class="pill option" id="hlNext2" type="button" tabindex="-1">2nd</button>
                </div>
              </div>

              <!-- Ghost -->
              <div id="ghostCursorSettings" class="settings pill" role="button" aria-pressed="false" tabindex="-1">
                <input type="checkbox" id="ghostModeToggle" hidden>
                <div class="ghost-title">
                  <span class="ghost-word">Ghost</span>
                  <span class="cursor ghost-cursor" aria-hidden="true"></span>
                  <span class="cursor real-cursor" aria-hidden="true"></span>
                </div>
                <div id="ghostWpmWrapper" class="pill-input below">
                  <label for="customGhostWPM" class="sr-only">Ghost WPM</label>
                  <input type="number" id="customGhostWPM" value="60" min="10" max="300" />
                </div>
              </div>

              <!-- End-if pills -->
              <div id="minWPMSettings" class="settings pill pill-split" role="button" aria-controls="endWpmWrapper">
                <input type="checkbox" id="endWpmToggle" class="pill-toggle" hidden>
                <div class="pill-name">End if WPM &lt;</div>
                <div id="endWpmWrapper" class="pill-input hidden">
                  <input type="number" id="endWpmValue" value="50" min="10" max="300" style="width: 4em;">
                </div>
              </div>

              <!-- New: End at # errors -->
              <div id="maxErrorsSettings" class="settings pill pill-split" role="button" aria-controls="endErrWrapper">
                <input type="checkbox" id="endErrToggle" class="pill-toggle" hidden>
                <div class="pill-name">End at # Errors</div>
                <div id="endErrWrapper" class="pill-input hidden">
                  <input id="endErrValue" type="number" min="1" step="1" placeholder="#" style="width: 4em;">
                  <span class="suffix">errors</span>
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- Hidden mirrors for logic (do NOT show in UI) -->
        <div id="hideWordsSettings" class="settings hidden">
          <span>🙈</span>
          <select id="hideWordsSelector">
            <option value="off" selected>Off</option>
            <option value="current">Current</option>
            <option value="currentNext">Current & Next</option>
          </select>
        </div>

        <div id="highlightAheadSettings" class="settings hidden">
          <span>🔦</span>
          <select id="highlightAheadSelector">
            <option value="off" selected>Off</option>
            <option value="next">Next Word</option>
            <option value="next2">2nd Word</option>
          </select>
        </div>

      </div>
    </div>
    <div class="typing-panel">

      <!-- Pre-game top-center hint (inside typing panel) -->
      <button
        type="button"
        class="pregame-hint"
        id="preGameShortcutNewWords"
        data-shortcut-action="newWords"
      >
        New words (Ctrl/Cmd+J)
      </button>
      
      <a
        id="martyPill"
        class="pregame-pill pill-right"
        href="https://martyhendricks.notion.site/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Open Marty’s Notion page"
      >
        <img class="pill-avatar" src="marty.png" alt="" />
        <span class="pill-text">Marty</span>
      </a>

      <!-- Error bubble (shown only on incorrect key when toggle is ON) -->
      <div id="typedErrorDisplay" class="typed-error-display hidden" aria-live="polite">
        <div class="typed-error-label">You typed:</div>
        <div id="typedLetter" class="typed-error-letter"></div>
      </div>

      <div id="typingHud" class="typing-hud">
        <div id="stats">
          <span id="wpm">WPM: 0</span>
          <span id="accuracy">Accuracy: 100%</span>
        </div>
        <div id="wordProgress" class="word-progress hidden">
          <div id="wordProgressFill" class="word-progress-fill"></div>
        </div>
        <div id="timerDisplay" class="timer-display hidden">
          <span id="timeRemaining"></span>
        </div>
      </div>
      <!-- Typing box -->
      <div class="text-error-wrapper">
        <div id="textDisplay"></div>
      </div>
      <!-- Results Screen -->
      <div id="resultsScreen" class="results-screen hidden">
        <!-- Hints FIRST -->
        <div class="results-hints" id="resultsHints">
          <button type="button" class="hint" data-shortcut-action="newMode">
            Settings (Ctrl/Cmd+I)
          </button>
          <button type="button" class="hint" data-shortcut-action="retry">
            Retry (Ctrl/Cmd+;)
          </button>
          <button type="button" class="hint" data-shortcut-action="newWords">
            New words (Ctrl/Cmd+J)
          </button>
        </div>

        <!-- Chips placeholder (the JS will populate this) -->
        <div id="runSettings" class="run-settings"></div>

        <!-- Final WPM / Accuracy -->
        <div class="results-stats">
          <div class="result-item">
            <span class="result-label">Final WPM:</span>
            <span id="finalWPM" class="result-value">0</span>
          </div>
          <div class="result-item">
            <span class="result-label">Accuracy:</span>
            <span id="finalAccuracy" class="result-value">100%</span>
          </div>
        </div>

        <div id="runGraph" class="run-graph"></div>
        <button id="restartButton" class="restart-button">Start New Session</button>
      </div>
      <!-- Keyboard Diagram -->
      <div id="keyboardDiagram" class="keyboard-diagram hidden">
        <img id="keyboardImage" src="keyboard_and_hand/default.png" alt="Keyboard and hand guide">
      </div>
    </div>
  </div>

  <!-- Focus-mode hint labels (visible only in focus mode) -->
  <button
    type="button"
    class="focus-hint left"
    id="hintNewMode"
    data-shortcut-action="newMode"
  >
    Settings (Ctrl/Cmd+I)
  </button>
  <button
    type="button"
    class="focus-hint right"
    id="hintRetry"
    data-shortcut-action="retry"
  >
    Retry (Ctrl/Cmd+;)
  </button>
  <button
    type="button"
    class="focus-hint right"
    id="hintNewWords"
    data-shortcut-action="newWords"
  >
    New words (Ctrl/Cmd+J)
  </button>

  
  <script type="module" src="./js/focusMode.js"></script>
  <script type="module" src="./js/main.js"></script>
  <!-- PDF + DOM to image (UMD builds; expose window.jspdf and window.html2canvas) -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script type="module" src="./js/defaultSelects.js"></script>
  <script src="./js/on-states.js" defer></script>
  <script type="module" src="./js/ui/stats-polish.js"></script>


</body>
</html>
